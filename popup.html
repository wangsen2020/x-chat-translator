<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Chat Translator</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 20px; color: #e7e9ea; background: #000; font: 13px/1.55 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; margin-bottom: 17px; }
    img { width: 48px; height: 48px; margin-right: 11px; }
    h1 { margin: 0; font-size: 16px; line-height: 1.2; }
    .sub { margin-top: 4px; color: #8b98a5; font-size: 11px; }
    p { margin: 0 0 15px; color: #c7cdd1; }
    a { display: block; padding: 10px 12px; border-radius: 999px; color: #fff; background: #1d9bf0; text-align: center; text-decoration: none; font-weight: 700; }
    a:hover { background: #1785d1; }
    .hint { margin-top: 13px; color: #8b98a5; font-size: 11px; }
    .settings { border-top: 1px solid #333; padding-top: 14px; margin-bottom: 16px; }
    label { display:block; margin-bottom:10px; }
    select { width:100%;margin-top:6px;padding:8px;background:#181818;color:#eee;border:1px solid #555;border-radius:6px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <div><h1>X Chat Translator</h1><div class="sub">发送前预览 · 收到即翻译</div></div>
  </header>
  <p>浏览帖子时保留原文，下方显示译文。在 X Chat 输入中文，确认译文后按 Enter 发送。</p>
  <div class="settings">
    <label><input id="posts-enabled" type="checkbox" disabled> 帖子双语翻译</label>
    <label for="reading-language">我的语言（帖子与收到的消息）
      <select id="reading-language" disabled>
        <option value="zh-CN">简体中文</option><option value="en">英语</option>
        <option value="es">西班牙语</option><option value="ja">日语</option>
        <option value="ko">韩语</option><option value="fr">法语</option>
        <option value="de">德语</option><option value="pt">葡萄牙语</option>
        <option value="ar">阿拉伯语</option><option value="ru">俄语</option>
      </select>
    </label>
    <div class="hint">适用于首页、推荐、详情及回复。保留原文，自动翻译可见帖子。</div>
    <div id="save-status" class="hint" role="status"></div>
  </div>
  <a href="https://x.com/i/chat/" target="_blank" rel="noopener noreferrer">打开 X Chat</a>
  <div class="hint">设置会在 X Chat 页面右侧显示。</div>
  <div class="hint">待翻译文字会发送至 Google Translate。翻译缓存仅保留在当前页面内存中，刷新后清空。</div>
</body>
<script src="popup.js"></script>
</html>
