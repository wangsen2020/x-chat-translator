<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101214"><title>翻译设置 · X Chat Translator</title>
<link rel="stylesheet" href="style.css"><script src="demo.js" defer></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="book" viewBox="0 0 24 24"><path d="M3 4h6a4 4 0 0 1 3 1.5A4 4 0 0 1 15 4h6v15h-6a4 4 0 0 0-3 1.5A4 4 0 0 0 9 19H3zM12 6v14"/></symbol>
<symbol id="route" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v4a5 5 0 0 0 5 5h4M10 6h7m-3-3 3 3-3 3"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></symbol>
<symbol id="refresh-icon" viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 8M20 2v6h-6"/></symbol>
</defs></svg>
<header class="bar"><div class="bar-inner"><div class="brand"><img src="../../icons/icon-48.png" alt="" width="34" height="34"> X Chat Translator</div><span class="prototype">本地交互原型</span></div></header>
<main><h1>翻译设置</h1>
<div class="grid">
<section class="panel" aria-labelledby="read-title">
<h2 id="read-title"><svg aria-hidden="true"><use href="#book"/></svg>阅读偏好</h2>
<label class="toggle-row">自动翻译可见帖子<input id="enabled" type="checkbox" checked role="switch"></label>
<label for="language">我的阅读语言</label>
<select id="language"><option value="zh">简体中文</option><option value="en">English</option></select>
<fieldset><legend>帖子显示方式</legend><div class="segments">
<label><input type="radio" name="mode" value="both" checked><span>双语对照</span></label>
<label><input type="radio" name="mode" value="replace"><span>原位替换</span></label>
</div></fieldset>
<div class="preview-heading"><h3>帖子预览</h3><span id="preview-caption">显示示例</span></div>
<div class="feed" id="feed"></div>
<p class="hint reading-note">阅读语言也用于收到的私信。</p>
</section>
<section class="panel" aria-labelledby="engine-title">
<h2 id="engine-title"><svg aria-hidden="true"><use href="#route"/></svg>帖子翻译引擎</h2>
<label for="engine">翻译服务</label>
<select id="engine"><option value="relay">AgentRelay</option><option value="google">Google Translate</option></select>
<div id="binding">
<label for="address">本地服务地址</label><input type="url" spellcheck="false" autocomplete="off" name="address" id="address" value="http://127.0.0.1:8787">
<label for="token">访问令牌</label><input type="password" id="token" autocomplete="off" name="demo-token" aria-describedby="token-hint" value="demo"><p class="hint" id="token-hint">原型使用演示令牌，请勿输入真实凭据。</p>
<div class="pair"><div><label for="provider">AI 引擎</label><select id="provider"><option value="codex">Codex</option><option value="antigravity">Antigravity</option></select></div>
<div><label for="session">已有会话</label><div class="session"><select id="session"></select>
<button type="button" class="icon-btn" id="refresh" aria-label="检测连接并刷新会话"><svg aria-hidden="true"><use href="#refresh-icon"/></svg><span class="tip" aria-hidden="true">检测连接并刷新会话</span></button></div></div></div>
</div>
<p class="scope" id="scope">只有帖子正文会交给所选会话。私信沿用 Google Translate。</p>
<div class="actions"><button type="button" class="primary" id="save">保存引擎</button><button type="button" id="trial"><svg aria-hidden="true"><use href="#play"/></svg>试译 2 条示例</button></div>
<p role="status" id="feedback"></p>
</section></div></main></body></html>
